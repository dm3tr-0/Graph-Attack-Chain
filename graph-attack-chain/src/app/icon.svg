<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Фон — тёмный щит -->
  <path d="M32 4 L56 16 L56 36 Q56 52 32 60 Q8 52 8 36 L8 16 Z"
        fill="url(#shieldGrad)" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Внутренний щит — тонкая обводка -->
  <path d="M32 10 L50 20 L50 34 Q50 47 32 54 Q14 47 14 34 L14 20 Z"
        fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>

  <!-- Узлы графа — точки атаки -->
  <!-- IP-источник (оранжевый) — внешний атакующий -->
  <circle cx="22" cy="18" r="3.5" fill="#f97316"/>
  <circle cx="22" cy="18" r="1.5" fill="#fbbf24"/>

  <!-- Хост-жертва (синий) — центральный -->
  <circle cx="38" cy="24" r="4" fill="#3b82f6"/>
  <circle cx="38" cy="24" r="1.8" fill="#60a5fa"/>

  <!-- Процесс (красный) — вредоносный -->
  <circle cx="28" cy="34" r="3" fill="#ef4444"/>
  <circle cx="28" cy="34" r="1.3" fill="#f87171"/>

  <!-- Файл (зелёный) — цель -->
  <circle cx="44" cy="38" r="3" fill="#22c55e"/>
  <circle cx="44" cy="38" r="1.3" fill="#4ade80"/>

  <!-- Пользователь (фиолетовый) -->
  <circle cx="20" cy="42" r="3" fill="#8b5cf6"/>
  <circle cx="20" cy="42" r="1.3" fill="#a78bfa"/>

  <!-- Домен C2 (жёлтый) -->
  <circle cx="36" cy="46" r="2.5" fill="#eab308"/>
  <circle cx="36" cy="46" r="1.1" fill="#facc15"/>

  <!-- Рёбра — связи между узлами (линии атаки) -->
  <!-- IP → Хост (атака извне) -->
  <line x1="25" y1="20" x2="34" y2="22" stroke="#f97316" stroke-width="1.5" opacity="0.8"/>

  <!-- Хост → Процесс (запуск) -->
  <line x1="35" y1="27" x2="30" y2="32" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>

  <!-- Процесс → Файл (файловая операция) -->
  <line x1="31" y1="35" x2="41" y2="37" stroke="#22c55e" stroke-width="1.5" opacity="0.8"/>

  <!-- Пользователь → Хост (аутентификация) -->
  <line x1="23" y1="40" x2="35" y2="27" stroke="#8b5cf6" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 1"/>

  <!-- Хост → Домен (C2-канал) -->
  <line x1="37" y1="28" x2="36" y2="44" stroke="#eab308" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 1"/>

  <!-- IP → Пользователь (компрометация) -->
  <line x1="21" y1="21" x2="20" y2="39" stroke="#f97316" stroke-width="1.2" opacity="0.5" stroke-dasharray="2 1"/>

  <!-- Стрелки на рёбрах (направление атаки) -->
  <polygon points="34,22 31,20 32,23" fill="#f97316" opacity="0.9"/>
  <polygon points="30,32 27,31 29,34" fill="#ef4444" opacity="0.9"/>
  <polygon points="41,37 38,35 39,38" fill="#22c55e" opacity="0.9"/>

  <!-- Блик на щите -->
  <path d="M32 10 L50 20 L50 28 Q40 22 32 18 Z" fill="white" opacity="0.04"/>
</svg>
